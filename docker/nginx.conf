upstream selenium { server selenium-hub:4444; }
upstream searxng { server searxng:8080; }
upstream firecrawl { server firecrawl:3002; }
upstream crawl4ai { server crawl4ai:11235; }

server {
    listen 80;
    server_name localhost;

    location /selenium/ {
        proxy_pass http://selenium/;
    }
    location /search/ {
        proxy_pass http://searxng/;
    }
    location /firecrawl/ {
        proxy_pass http://firecrawl/;
    }
    location /crawl4ai/ {
        proxy_pass http://crawl4ai/;
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"research-mcp-stack"}';
    }
}
