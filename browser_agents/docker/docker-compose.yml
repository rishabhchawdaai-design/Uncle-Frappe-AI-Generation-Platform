# Research MCP Stack — Section 2: Browser Agents Services
version: "3.9"

services:
  # ── Selenium Grid ──────────────────────────────────
  selenium-hub:
    image: selenium/hub:4.21.0
    container_name: selenium-hub
    ports: ["4442:4442", "4443:4443", "4444:4444"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 15s
      timeout: 10s
      retries: 3

  selenium-chrome:
    image: selenium/node-chrome:4.21.0
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    shm_size: "3g"

  selenium-firefox:
    image: selenium/node-firefox:4.21.0
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    shm_size: "2g"

  # ── Browserless ────────────────────────────────────
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    ports: ["3000:3000"]
    environment:
      - TOKEN=${BROWSERLESS_TOKEN:-}
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=30000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Skyvern ─────────────────────────────────────────
  skyvern:
    image: ghcr.io/skyvern/skyvern:latest
    container_name: skyvern
    ports: ["8080:8080"]
    environment:
      - SKYVERN_API_KEY=${SKYVERN_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── OpenHands ──────────────────────────────────────
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands
    ports: ["3000:3000"]
    volumes:
      - ./workspace:/workspace
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:0.9-nikolaik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Steel Browser ──────────────────────────────────
  steel:
    image: steel/steel-browser:latest
    container_name: steel-browser
    ports: ["3001:3001"]
    environment:
      - STEEL_API_KEY=${STEEL_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── OmniParser ─────────────────────────────────────
  omniparser:
    image: mhcao/omniparser:latest
    container_name: omniparser
    ports: ["8081:8081"]
    environment:
      - USE_CUDA=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Chrome Remote Debug (for chromium_remote) ──────
  chrome-debug:
    image: browserless/chrome:latest
    container_name: chrome-debug
    ports: ["9222:9222"]
    command: ["--no-sandbox", "--remote-debugging-port=9222", "--remote-debugging-address=0.0.0.0"]
    shm_size: "2g"

  # ── Stagehand ──────────────────────────────────────
  stagehand:
    build:
      context: .
      dockerfile: Dockerfile.stagehand
    container_name: stagehand
    ports: ["7777:7777"]
    environment:
      - BROWSERBASE_API_KEY=${BROWSERBASE_API_KEY:-}

  # ── Nginx Gateway ──────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: browser-gateway
    ports: ["8889:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - selenium-hub
      - browserless
      - skyvern
      - steel

volumes:
  workspace:
