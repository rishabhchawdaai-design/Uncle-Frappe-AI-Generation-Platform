upstream selenium { server selenium-hub:4444; }
upstream browserless { server browserless:3000; }
upstream skyvern { server skyvern:8080; }
upstream steel { server steel:3001; }
upstream omniparser { server omniparser:8081; }

server {
    listen 80;
    location /selenium/  { proxy_pass http://selenium/; }
    location /browserless/ { proxy_pass http://browserless/; }
    location /skyvern/   { proxy_pass http://skyvern/; }
    location /steel/     { proxy_pass http://steel/; }
    location /omniparser/ { proxy_pass http://omniparser/; }
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"browser-agents-gateway"}';
    }
}
