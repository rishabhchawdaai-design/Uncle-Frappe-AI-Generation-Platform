upstream neo4j { server neo4j:7474; }
upstream searxng { server searxng:8080; }
upstream elasticsearch { server elasticsearch:9200; }
upstream weaviate { server weaviate:8080; }
upstream qdrant { server qdrant:6333; }
upstream grobid { server grobid:8070; }

server {
    listen 80;
    location /neo4j/ { proxy_pass http://neo4j/; }
    location /search/ { proxy_pass http://searxng/; }
    location /es/ { proxy_pass http://elasticsearch/; }
    location /weaviate/ { proxy_pass http://weaviate/; }
    location /qdrant/ { proxy_pass http://qdrant/; }
    location /grobid/ { proxy_pass http://grobid/; }
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"research-mcp-orchestrator"}';
    }
}
