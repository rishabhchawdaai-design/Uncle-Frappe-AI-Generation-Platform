version: "3.9"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports: ["8080:8080"]
  yacy:
    image: yacy/yacy_search_server:latest
    container_name: yacy
    ports: ["8090:8090"]
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports: ["7474:7474", "7687:7687"]
    environment: [NEO4J_AUTH=neo4j/research-mcp]
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: memgraph
    ports: ["7444:7687"]
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports: ["6380:6380"]
  arangodb:
    image: arangodb:3.12
    container_name: arangodb
    ports: ["8529:8529"]
    environment: [ARANGO_ROOT_PASSWORD=research-mcp]
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: weaviate
    ports: ["8080:8080"]
    environment: [AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true]
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports: ["6333:6333", "6334:6334"]
  milvus:
    image: milvusdb/milvus:latest
    container_name: milvus
    ports: ["19530:19530"]
  redis:
    image: redis:7-alpine
    container_name: redis
    ports: ["6379:6379"]
  grobid:
    image: lfoppiano/grobid:latest
    container_name: grobid
    ports: ["8070:8070"]
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    ports: ["9200:9200"]
    environment: [discovery.type=single-node, xpack.security.enabled=false]
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    ports: ["9201:9200"]
    environment: [discovery.type=single-node, DISABLE_SECURITY_PLUGIN=true]
  gateway:
    image: nginx:alpine
    container_name: research-gateway
    ports: ["8888:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf"]
    depends_on: [neo4j, searxng, elasticsearch]
