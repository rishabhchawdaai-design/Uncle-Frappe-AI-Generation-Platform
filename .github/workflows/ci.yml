name: Uncle Frappe AI Generation Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run full platform test suite
        run: |
          PYTHONPATH=. pytest ai_generation/tests/ -q --tb=short

      - name: Verify all platform modules import cleanly
        run: |
          PYTHONPATH=. python -c "
          import importlib, pkgutil, ai_generation
          failed = []
          for m in pkgutil.iter_modules(ai_generation.__path__):
              try:
                  importlib.import_module('ai_generation.' + m.name)
              except Exception as e:
                  failed.append(m.name + ': ' + type(e).__name__ + ': ' + str(e))
          assert not failed, 'Module import failures: ' + repr(failed)
          print('All', sum(1 for _ in pkgutil.iter_modules(ai_generation.__path__)), 'modules imported cleanly')
          "

      - name: Smoke test unified SDK
        run: |
          PYTHONPATH=. python -c "
          import asyncio
          from ai_generation import UncleFrappeAI
          ai = UncleFrappeAI()
          stats = ai.get_stats()
          print('SDK stats keys:', len(stats))
          print('Providers:', stats['generation']['provider_summary']['total_providers'])
          print('SDK smoke test passed')
          "

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t uncle-frappe-ai-generation-platform .
      - name: Verify Docker image
        run: docker run --rm uncle-frappe-ai-generation-platform python -c "
          import ai_generation
          print('Docker image OK, version', ai_generation.__version__)
          "
